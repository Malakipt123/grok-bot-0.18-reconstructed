name: repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # The preserved installers are Git LFS objects; tests hash the real files.
      # They are cached by the manifest that pins their SHA-256, so CI downloads
      # them only when they change instead of spending LFS bandwidth every run.
      - name: Restore Git LFS objects
        uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('research-archives/**/artifacts.json') }}
      # A global install also gives the publication check's fresh export repo the LFS filters.
      - name: Fetch Git LFS objects
        run: |
          git lfs install
          git lfs pull
      - uses: actions/setup-node@v5
        with:
          node-version: 26.5.0
          cache: npm
      - name: Install the locked dependency graph
        run: npm ci --no-audit --no-fund
      - name: Run source and publication checks
        run: npm run check
      - name: Build the editable frontend
        run: npm run frontend:build
      - name: Verify a fresh clean-history export is lossless
        run: npm run publication:check
